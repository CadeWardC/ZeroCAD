[package]
name = "zerocad-gui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "egui/eframe desktop front end for the ZeroCAD parametric CAD application."
repository = "https://github.com/CadeWardC/ZeroCAD"

[dependencies]
zerocad-core = { path = "../zerocad-core" }
# The workspace viewport renders its 3D scene on the GPU: eframe runs on the
# wgpu backend, egui-wgpu registers the offscreen scene texture, and
# openrcad-render's `RenderCore` does the actual drawing. The GUI uses egui
# through eframe's public re-export.
eframe = { workspace = true, features = ["wgpu"] }
egui-wgpu.workspace = true
wgpu.workspace = true
openrcad-render.workspace = true
# serde / serde_json are kept for the in-progress Save / Export feature.
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
rfd.workspace = true
# Encodes/decodes the preview thumbnail embedded inside a `.zcad` file.
png.workspace = true
