[package]
name = "zerocad-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zerocad-core = { path = "../zerocad-core" }

[[bin]]
name = "boolean_safety"
path = "fuzz_targets/boolean_safety.rs"
test = false
doc = false
bench = false

[[bin]]
name = "boolean_resolvable"
path = "fuzz_targets/boolean_resolvable.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# Recovery and resolvability targets exercise the guarded boolean boundary;
# aborting would bypass its catch_unwind contract and turn a classified kernel
# failure into a process crash before the harness can promote the case.
[profile.release]
panic = "unwind"
