name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Full-app build + tests on the primary development platform. Windows runners
  # ship the graphics/system libraries wgpu/winit/rfd need, so no extra setup.
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked

  # Geometry/parametric engine on Linux. zerocad-core has no GUI dependencies,
  # so it builds and tests cleanly without any system packages — fast coverage
  # of the kernel, STL export, and serialization on a second platform.
  core-unix:
    name: Core engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ZEROCAD_LONG_STRESS_ITERATIONS: 96
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test zerocad-core
        run: cargo test -p zerocad-core --locked

  # OpenRCAD is intentionally a separate workspace, so the jobs above only
  # compile it as a dependency; they do not run the kernel's own regression
  # suites. Geometry changes are not safe unless these tests run as a hard gate.
  openrcad-platforms:
    name: OpenRCAD kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: OpenRCAD
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: OpenRCAD -> target
      - name: Test OpenRCAD workspace
        run: cargo test --workspace --locked

  # Formatting is normalized and required.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: rustfmt (OpenRCAD workspace)
        working-directory: OpenRCAD
        run: cargo fmt --all -- --check

  # Phase 7 makes static-analysis execution a hard gate. Individual legacy
  # lints remain explicitly reviewed in source; command failure is not ignored.
  clippy:
    name: Clippy (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (core)
        run: cargo clippy -p zerocad-core --all-targets
      - name: clippy (OpenRCAD workspace)
        working-directory: OpenRCAD
        run: cargo clippy --workspace --all-targets
