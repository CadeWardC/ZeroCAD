[workspace]
resolver = "2"
members = [
    "zerocad-core",
    "zerocad-gui",
]
# OpenRCAD is its own cargo workspace living inside this tree; exclude it so this
# workspace doesn't try to absorb its member crates. It is consumed only through
# the `openrcad` facade path dependency below.
exclude = [
    "OpenRCAD",
]

# Release profile tuned for a lean, fast binary.
# NOTE: `panic` is deliberately left at the default "unwind" — `guarded_boolean`
# in zerocad-core relies on `std::panic::catch_unwind` to survive truck's
# boolean-solver panics on cylinders/coplanar faces. Setting panic = "abort"
# here would turn those recoverable panics into hard crashes.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"

[workspace.dependencies]
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
# The GUI viewport shares wgpu with `openrcad-render` (pinned to wgpu 22), so the
# whole egui/eframe/egui-wgpu stack is held at 0.29 — the release that targets
# wgpu 22. Bumping either side off this pairing reintroduces the type-mismatch
# that kept the GPU renderer out of the app.
wgpu = "22"
egui-wgpu = "0.29"
eframe = { version = "0.29", features = ["wgpu"] }
openrcad = { path = "./OpenRCAD" }
# The reusable GPU render core (device-injected `RenderCore`), consumed only by
# the GUI. Deliberately NOT part of the `openrcad` facade — GPU deps stay out of
# the kernel. `viewer-app` (winit standalone window) is disabled here; the GUI
# supplies eframe's device/queue instead.
openrcad-render = { path = "./OpenRCAD/crates/openrcad-render", default-features = false, features = ["native-backends", "parallel"] }
rfd = "0.14"
ciborium = "0.2"
zstd = "0.13"
blake3 = "1.5"
png = "0.17"
