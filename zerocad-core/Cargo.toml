[package]
name = "zerocad-core"
version = "0.7.5"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Pure geometry and parametric-history engine for ZeroCAD (no UI, no GPU)."
repository = "https://github.com/CadeWardC/ZeroCAD"

[dependencies]
petgraph.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
openrcad.workspace = true
ciborium.workspace = true
zstd.workspace = true
blake3.workspace = true
sha2.workspace = true
nalgebra.workspace = true

[dev-dependencies]
criterion = "0.5"
proptest = "1.6"
tempfile = "3"

[[bench]]
name = "modeling_pipeline"
harness = false
